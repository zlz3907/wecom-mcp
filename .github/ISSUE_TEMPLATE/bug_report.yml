name: Bug report
description: 报告可复现的问题
body:
  - type: markdown
    attributes:
      value: 不要提交凭据、token、个人数据、真实文档/表格 ID 或生产日志。
  - type: input
    id: version
    attributes:
      label: Version
      description: 受影响的版本或 commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: 请使用脱敏后的复现步骤和输出
    validations:
      required: true
