# Review-only gmzoop configuration. The existing jyiai.com wildcard certificate was read-only
# verified for mcp.jyiai.com. Do not install until the deployed teamserver build
# has passed a prefixed TEAM_MCP_PUBLIC_URL startup/metadata check.

merge_slashes off;

limit_req_zone $binary_remote_addr zone=gmzoop_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=gmzoop_conn:10m;

log_format team_mcp '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time '
                    'request_id=$request_id upstream=$upstream_addr '
                    'ua="$http_user_agent"';

upstream team_mcp_gmzoop {
    server 127.0.0.1:7702;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.jyiai.com;

    if ($host != "mcp.jyiai.com") { return 444; }

    location / {
        return 308 https://mcp.jyiai.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mcp.jyiai.com;

    if ($host != "mcp.jyiai.com") { return 444; }
    if ($request_uri ~ "%") { return 400; }

    ssl_certificate /root/nginx/cert/jyiai.com.pem;
    ssl_certificate_key /root/nginx/cert/jyiai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 2m;
    client_body_timeout 30s;
    send_timeout 60s;
    reset_timedout_connection on;

    # ----- gmzoop: public prefix /gmzoop, upstream root on 127.0.0.1:7702 -----
    location = /gmzoop/mcp {
        access_log /var/log/nginx/mcp-gmzoop.access.log team_mcp;
        error_log /var/log/nginx/mcp-gmzoop.error.log warn;
        limit_req zone=gmzoop_rate burst=10 nodelay;
        limit_conn gmzoop_conn 8;

        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Host 127.0.0.1:7702;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header MCP-Session-Id $http_mcp_session_id;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /gmzoop;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;

        proxy_pass http://team_mcp_gmzoop/mcp;
    }

    location = /gmzoop/healthz {
        access_log /var/log/nginx/mcp-gmzoop.access.log team_mcp;
        error_log /var/log/nginx/mcp-gmzoop.error.log warn;
        proxy_set_header Host 127.0.0.1:7702;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://team_mcp_gmzoop/healthz;
    }

    location = /gmzoop/readyz {
        access_log /var/log/nginx/mcp-gmzoop.access.log team_mcp;
        error_log /var/log/nginx/mcp-gmzoop.error.log warn;
        proxy_set_header Host 127.0.0.1:7702;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://team_mcp_gmzoop/readyz;
    }

    location = /gmzoop/.well-known/oauth-protected-resource {
        access_log /var/log/nginx/mcp-gmzoop.access.log team_mcp;
        error_log /var/log/nginx/mcp-gmzoop.error.log warn;
        proxy_set_header Host 127.0.0.1:7702;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /gmzoop;
        proxy_pass http://team_mcp_gmzoop/.well-known/oauth-protected-resource;
    }

    # RFC 9728 discovery path for resource https://mcp.jyiai.com/gmzoop/mcp.
    location = /.well-known/oauth-protected-resource/gmzoop/mcp {
        access_log /var/log/nginx/mcp-gmzoop.access.log team_mcp;
        error_log /var/log/nginx/mcp-gmzoop.error.log warn;
        proxy_set_header Host 127.0.0.1:7702;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /gmzoop;
        proxy_pass http://team_mcp_gmzoop/.well-known/oauth-protected-resource;
    }

    location ^~ /gmzoop/ { return 404; }
    location = /gmzoop { return 308 /gmzoop/mcp; }

    location / { return 404; }
}
